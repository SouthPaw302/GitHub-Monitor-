name: AEGIS Telemetry Snapshot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_OWNER: SouthPaw302
      MONITOR_REPOS: ${{ vars.MONITOR_REPOS }}
      MONITOR_GITHUB_TOKEN: ${{ secrets.MONITOR_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture repository telemetry
        run: node scripts/github-snapshot.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-telemetry-snapshot
          path: monitor-snapshot.json
          retention-days: 7

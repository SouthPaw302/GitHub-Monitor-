name: AEGIS Site Health

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://githubmonitor-seven.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Probe live telemetry
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 25 -w '%{http_code}' "$SITE_URL/api/monitor" -o site-health.json || true)"
          echo "HTTP status: $status"
          cat site-health.json || true
          test "$status" = "200"
          node -e 'const x=require("./site-health.json"); if(!x.generatedAt||!x.summary) process.exit(2); console.log("AEGIS SITE HEALTH: PASS", x.generatedAt, "repos=", x.summary.repoCount)'

      - name: Probe page shell
        if: always()
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 25 -w '%{http_code}' "$SITE_URL/" -o site-home.html || true)"
          echo "HTTP status: $status"
          test "$status" = "200"
          grep -q "AEGIS" site-home.html
          echo "AEGIS PAGE SHELL: PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-site-health
          path: |
            site-health.json
            site-home.html
          if-no-files-found: ignore
          retention-days: 3

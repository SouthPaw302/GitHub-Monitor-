name: AEGIS Build Gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript gate
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Package build evidence
        if: always()
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const evidence = {
            repository: process.env.GITHUB_REPOSITORY,
            sha: process.env.GITHUB_SHA,
            run_id: process.env.GITHUB_RUN_ID,
            run_number: process.env.GITHUB_RUN_NUMBER,
            generated_at: new Date().toISOString(),
            next_build_present: fs.existsSync(".next/BUILD_ID"),
            routes_manifest_present: fs.existsSync(".next/routes-manifest.json")
          };
          fs.writeFileSync("aegis-build-evidence.json", JSON.stringify(evidence, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-build-evidence
          path: aegis-build-evidence.json
          retention-days: 7
